{% extends "base.html" %}
{% block content %}
<h2>Cadastrar Novo Colaborador</h2>
<p class="subtitle">Insira as informações do integrante da equipe conforme o diagrama.</p>
<div class="form-container">
    <form action="{{ url_for('cadastrar_pessoa') }}" method="POST">
        <div style="display: grid; grid-template-columns: repeat(auto-fit, minmax(280px, 1fr)); gap: 1.5rem;">
            <div class="form-group">
                <label for="nome">Nome Completo:</label>
                <input type="text" id="nome" name="nome" class="form-control" placeholder="Ex: Lucas Mendes" required>
            </div>
            <div class="form-group">
                <label for="email">E-mail Corporativo:</label>
                <input type="email" id="email" name="email" class="form-control" placeholder="Ex: lucas@taskflow.com" required>
            </div>
        </div>
        <div style="display: grid; grid-template-columns: repeat(auto-fit, minmax(280px, 1fr)); gap: 1.5rem;">
            <div class="form-group">
                <label for="senha">Senha de Acesso:</label>
                <input type="password" id="senha" name="senha" class="form-control" placeholder="Senha segura" required>
            </div>
            <div class="form-group">
                <label for="data_nascimento">Data de Nascimento:</label>
                <input type="date" id="data_nascimento" name="data_nascimento" class="form-control" required>
            </div>
        </div>
        <div style="display: flex; gap: 1rem; margin-top: 1rem;">
            <button type="submit" class="btn" style="width: auto; padding: 0.75rem 2rem;">Salvar Colaborador</button>
            <a href="{{ url_for('gerenciar_pessoas') }}" class="btn" style="background-color: #1e293b; color: #e2e8f0; text-decoration: none; text-align: center; width: auto; padding: 0.75rem 2rem; border: 1px solid #374151;">Cancelar</a>
        </div>
    </form>
</div>
{% endblock %}
