{% extends "base.html" %}
{% block title %}Cadastrar Atividade{% endblock %}

{% block content %}
<h2>Cadastrar Nova Atividade</h2>
<p class="subtitle">Preencha os campos abaixo para registrar uma tarefa no sistema:</p>

<div class="form-container">
    <form action="{{ url_for('criar_atividade') }}" method="POST">

        <div class="form-group">
            <label for="titulo">Título da Atividade:</label>
            <input type="text" id="titulo" name="titulo" class="form-control" placeholder="Ex: Revisar relatório mensal" required>
        </div>

        <div class="form-group">
            <label for="descricao">Descrição:</label>
            <textarea id="descricao" name="descricao" class="form-control" placeholder="Detalhes da tarefa..." rows="3" required></textarea>
        </div>

        <div class="form-group">
            <label for="prioridade">Prioridade:</label>
            <select id="prioridade" name="prioridade" class="form-control">
                <option value="Baixa">Baixa</option>
                <option value="Média" selected>Média</option>
                <option value="Alta">Alta</option>
            </select>
        </div>

        <!-- Seção de recursos necessários atualizada com as classes escuras -->
        <div class="form-group">
            <label>Recursos Necessários:</label>
            <div class="checkbox-group">
                <label class="checkbox-label">
                    <input type="checkbox" name="recursos" value="Computador"> Computador
                </label>
                <label class="checkbox-label">
                    <input type="checkbox" name="recursos" value="Celular"> Celular
                </label>
                <label class="checkbox-label">
                    <input type="checkbox" name="recursos" value="Internet"> Internet
                </label>
            </div>
        </div>

        <button type="submit" class="btn">
            Salvar Atividade (Cadastrar)
        </button>
    </form>
</div>
{% endblock %}
