{% extends "base.html" %}
{% block content %}
<h2>Cadastrar Novo Tipo</h2>
<p class="subtitle">Defina uma nova classificação conceitual para as tarefas.</p>
<div class="form-container">
    <form action="{{ url_for('cadastrar_tipo') }}" method="POST">
        <div class="form-group">
            <label for="nome">Nome do Tipo:</label>
            <input type="text" id="nome" name="nome" class="form-control" placeholder="Ex: Urgente, Administrativo, Técnico" required>
        </div>
        <div class="form-group">
            <label for="desc">Descrição / Escopo:</label>
            <input type="text" id="desc" name="desc" class="form-control" placeholder="Descreva suscintamente o objetivo desse tipo..." required>
        </div>
        <div style="display: flex; gap: 1rem; margin-top: 1rem;">
            <button type="submit" class="btn" style="width: auto; padding: 0.75rem 2rem;">Salvar Tipo</button>
            <a href="{{ url_for('gerenciar_tipos') }}" class="btn" style="background-color: #1e293b; color: #e2e8f0; text-decoration: none; text-align: center; width: auto; padding: 0.75rem 2rem; border: 1px solid #374151;">Cancelar</a>
        </div>
    </form>
</div>
{% endblock %}
